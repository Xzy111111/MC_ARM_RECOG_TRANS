amcl:
  ros__parameters:
    use_sim_time: False  # 使用仿真时间


    # 越小越相信里程计数据，越大越相信传感器数据
    alpha1: 0.00001  # 里程计旋转到旋转的噪声系数
    alpha2: 0.00001  # 里程计旋转到平移的噪声系数
    alpha3: 0.00001  # 里程计平移到旋转的噪声系数
    alpha4: 0.00001  # 里程计平移到平移的噪声系数
    alpha5: 0.00001  # 最终旋转的噪声系数  
    base_frame_id: "base_link"  # 机器人基座标系
    beam_skip_distance: 0.5  # 光束跳过的距离阈值
    beam_skip_error_threshold: 0.9  # 光束跳过误差阈值
    beam_skip_threshold: 0.3  # 光束跳过阈值
    do_beamskip: false  # 是否启用光束跳过
    global_frame_id: "map"  # 全局坐标系
    lambda_short: 0.1  # 短距离激光测量的权重
    laser_likelihood_max_dist: 2.0  # 激光似然场最大距离
    laser_max_range: 20.0  # 激光最大测量范围
    laser_min_range: 0.2  # 激光最小测量范围
    laser_model_type: "likelihood_field"  # 激光模型类型
    max_beams: 60  # 最大使用的激光束数
    max_particles: 10000  # 最大粒子数
    min_particles: 2000  # 最小粒子数
    odom_frame_id: "odom"  # 里程计坐标系
    pf_err: 0.02  # 粒子滤波误差
    pf_z: 0.99  # 粒子滤波置信度
    recovery_alpha_fast: 0.1  # 快速恢复因子
    recovery_alpha_slow: 0.001  # 慢速恢复因子
    resample_interval: 1  # 重采样间隔
    robot_model_type: "nav2_amcl::OmniMotionModel"  # 机器人运动模型类型：全向运动模型
    save_pose_rate: 0.5  # 保存位姿的频率
    sigma_hit: 0.2  # 激光测量噪声标准差
    tf_broadcast: false  # 是否广播TF变换
    transform_tolerance: 0.2  # TF变换容忍时间，里程计准所以可以收紧
    update_min_a: 100.0  # 极大值≈不触发，完全信任里程计，只靠激光匹配修正
    update_min_d: 100.0  # 同上
    z_hit: 0.95  # 正确测量的权重
    z_max: 0.0  # 最大距离测量的权重
    z_rand: 0.05  # 随机测量的权重
    z_short: 0.0  # 短距离测量的权重
    scan_topic: /livox/scan  # 激光扫描话题
    # 初始位姿（地图原点，中等协方差）
    # AMCL 仍为软禁用 (alpha≈0)，但给了初始位姿后 AMCL 粒子从正确位置开始，
    # 不至于让代价地图把机器人起点当成障碍物导致 MPPI 全轨迹碰撞。
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    initial_cov_xx: 0.5
    initial_cov_yy: 0.5
    initial_cov_aa: 0.3

bt_navigator:
  ros__parameters:
    use_sim_time: False  # 使用仿真时间
    always_reload_bt_xml: true  # 每次激活时重新加载行为树XML，避免僵尸状态

    global_frame: map  # 全局坐标系
    robot_base_frame: base_link  # 机器人基座标系
    odom_topic: /Odometry # 里程计话题 (standard 10Hz, 稳定)
    bt_loop_duration: 10  # 行为树循环持续时间(ms)
