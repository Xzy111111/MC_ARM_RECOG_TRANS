pointcloud_to_laserscan:
  ros__parameters:
    # 坐标系设置
    target_frame: base_link
    transform_tolerance: 0.01
    
    # 第一个激光扫描参数
    min_height: 0.0              # 最小高度 
    max_height: 0.5             # 最大高度
    angle_min: -3.14159             # 起始角度
    angle_max: 3.14159            # 结束角度
    angle_increment: 0.0043      # 角度增量
    scan_time: 0.1              # 扫描时间
    range_min: 0.2              # 最小距离
    range_max: 15.0             # 最大距离
    use_inf: true                # 是否使用无穷大
    inf_epsilon: 1.0           # 无穷大容差
    scan_out_topic: '/livox/scan'  # 第一个扫描输出话题
    
    # 第二个激光扫描配置
    enable_second_scan: false       # 启用第二个扫描转换
    scan_out_topic2: '/livox/scan2' # 第二个扫描输出话题
    target_frame2: base_link       # 第二个扫描的目标坐标系
    min_height2: 0.4               # 第二个扫描的最小高度
    max_height2: 0.5               # 第二个扫描的最大高度
    angle_min2: -3.14159              # 第二个扫描的起始角度
    angle_max2: 3.14159               # 第二个扫描的结束角度
    angle_increment2: 0.0087       # 第二个扫描的角度增量
    scan_time2: 0.1                # 第二个扫描的时间
    range_min2: 0.2                # 第二个扫描的最小距离
    range_max2: 7.0               # 第二个扫描的最大距离
    use_inf2: true                 # 第二个扫描是否使用无穷大
    inf_epsilon2: 1.0              # 第二个扫描的无穷大容差

    # 输入话题配置
    cloud_in_topic: '/livox/lidar'